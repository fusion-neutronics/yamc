name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    # Per branch rather than one queue for the whole workflow: builds are
    # independent of each other and only the deploy has to be serialised.
    # Sharing the deploy's group would make every pull request wait behind
    # every other one, and a newer pending run would cancel an older one, so
    # most pull requests never got a build at all. A superseded build of the
    # same branch is cancelled, since nothing reads its result once a newer
    # commit exists.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the docs toolchain and yamc-core
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          # mkdocstrings reads the .pyi stubs shipped inside this wheel, and
          # markdown-exec actually runs the code blocks in the pages, so the
          # extension has to be importable and not merely readable. The pin
          # matches pyproject's, so the pages document exactly the version
          # `pip install yamc` resolves to.
          PIN="$(grep -oP 'yamc-core==\K[^"]+' pyproject.toml)"
          pip install "yamc-core[all]==$PIN"

      - name: Build
        env:
          MPLBACKEND: Agg   # headless matplotlib for the executed plot blocks
        run: mkdocs build -f mkdocs.yml

      - name: The API reference must be typed
        shell: bash
        run: |
          # An empty reference page builds and deploys just as happily as a full
          # one. Assert both that griffe found the stubs and that it kept the
          # annotations, which is what proves it read the .pyi and not the
          # annotation-free compiled module.
          python - <<'EOF'
          import re, pathlib, sys
          html = pathlib.Path("site/api/index.html").read_text()
          text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", html).replace("&#39;", "'"))
          ok = ("yamc.Material" in html
                and "yamc.Model" in html
                and re.search(r"density.{0,8}float", text)
                and re.search(r"units.{0,8}str", text))
          print("typed reference rendered from the yamc-core stubs:", bool(ok))
          sys.exit(0 if ok else 1)
          EOF

      - name: The documented examples must type-check against that wheel
        shell: bash
        run: |
          # The API reference is generated from the wheel, so it cannot go
          # stale. The examples on the prose pages are hand-written and can:
          # README.md called `yamc.Sphere(r=...)` and `yamc.Discrete`, neither
          # of which exists, and materials.md iterated a `TransmutationResults`
          # as if it were a list. All of it kept rendering
          # and deploying. A type check against the shipped .pyi stubs catches
          # that class without needing nuclear data or a solve.
          python docs/check_examples.py

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; queued rather than cancelled so a merge is never
    # published over by an older run.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
