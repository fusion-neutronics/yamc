name: Publish to PyPI

# `yamc` is a metadata-only distribution: it carries no code and exists to give
# the compiled `yamc-core` wheel a name people can install. Its one job is to
# depend on the matching yamc-core version, so the release order is fixed:
# yamc-core goes out first, from the core repository, and this follows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to pyproject's, no upload)"
        required: false

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set the version and the yamc-core pins from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          # The version and every yamc-core pin, together: the dependency's and
          # each extra's. A release whose pin lagged would install a core wheel
          # that does not match these docs, and an extra pinned apart from the
          # dependency could not be installed at all.
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/\"yamc-core(\[[^]\"]*\])?==[^\"]*\"/\"yamc-core\1==$VERSION\"/g" pyproject.toml
          grep -E '^version|"yamc-core' pyproject.toml

      - name: The pinned yamc-core must already be on PyPI, with every extra
        shell: bash
        run: |
          # Publishing ahead of the core release would put a permanently
          # uninstallable version on PyPI: the pins are exact, and a PyPI
          # version can never be re-uploaded once it exists. An extra that the
          # pinned yamc-core does not declare is the quieter version of the same
          # mistake: pip skips it with a warning, so `pip install "yamc[cad]"`
          # would succeed without installing cadquery. The script checks every
          # pin is the one version, that version is on PyPI, and each extra is
          # one it declares (see its docstring).
          python docs/check_extras.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel must contain no Python
        shell: bash
        run: |
          # The whole design is that this distribution ships metadata only. A
          # stray module here would shadow the one yamc-core provides and the
          # failure would look like a missing attribute at import time.
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if not n.startswith("yamc-") or n.endswith((".py", ".pyi", ".so"))]
          print(f"{whl}:", *zipfile.ZipFile(whl).namelist(), sep="\n  ")
          if bad:
              sys.exit(f"wheel ships more than metadata: {bad}")
          print("metadata-only: OK")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yamc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
