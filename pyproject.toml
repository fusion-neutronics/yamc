[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamc"
# Kept in lockstep with yamc-core: CI rewrites this and every yamc-core pin
# below from the release tag, and refuses to publish if that version is not on
# PyPI yet.
version = "0.16.3"
description = "Yet Another Monte Carlo: neutron and photon transport with mesh geometry support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["nuclear", "monte-carlo", "neutronics", "transport", "fusion", "shielding"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

# The whole distribution. `yamc-core` is the compiled wheel and it provides the
# `yamc` module itself, so this package deliberately ships no code: nothing to
# re-export, nothing to keep in sync, and no second copy of the type stubs.
# (`pip install pillow` giving `import PIL` is the same arrangement.)
#
# The pin is exact. A range would let `pip install yamc==0.4.0` resolve to a
# core wheel whose API does not match the docs published for 0.4.0.
dependencies = ["yamc-core==0.16.3"]

# yamc-core's extras under the same names, so `pip install "yamc[cad]"` works
# as `pip install yamc` does and nobody needs the second name. Each is the
# yamc-core extra of the same name at the same exact pin as the dependency: an
# extra pinned apart from it could not be resolved, which is why publish.yml
# rewrites every pin in this file together. docs/check_extras.py fails the docs
# build and the release if yamc-core declares an extra not forwarded here, or
# this or the docs name one that yamc-core does not declare. yamc-core's `dev`
# is left out on purpose: it is the tooling for building yamc-core from a
# checkout of fusion-neutronics/core, not something a user of `yamc` installs.
[project.optional-dependencies]
cad = ["yamc-core[cad]==0.16.3"]
viz = ["yamc-core[viz]==0.16.3"]
pandas = ["yamc-core[pandas]==0.16.3"]
polars = ["yamc-core[polars]==0.16.3"]
xarray = ["yamc-core[xarray]==0.16.3"]
all = ["yamc-core[all]==0.16.3"]

[project.urls]
Homepage = "https://github.com/fusion-neutronics/yamc"
Documentation = "https://fusion-neutronics.github.io/yamc/"
Repository = "https://github.com/fusion-neutronics/yamc"
Issues = "https://github.com/fusion-neutronics/yamc/issues"

# Hatchling expects to find a package to build; there is none, and that is the
# point. Declaring an empty file set makes the metadata-only wheel explicit
# rather than a build error.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE-MIT", "LICENSE-APACHE", "pyproject.toml"]
